# Minimal Supabase CLI configuration for local development.
# `supabase start` then `supabase db reset` applies migrations + seed.sql.
project_id = "newton-house"

[api]
port = 54321

[db]
port = 54322
major_version = 15

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

[auth.email]
enable_signup = true
enable_confirmations = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
